services:
  - type: web
  name: orbion-website
  env: node
  plan: starter
  region: ohio
  buildCommand: npm install && npm run build
  startCommand: npm run start
  autoDeploy: true
  healthCheckPath: /
  envVars:
    - key: NODE_ENV
      value: production
    - key: NEXT_PUBLIC_SITE_URL
      value: https://orbiontechnologies.in
    - key: BETTER_AUTH_URL
      value: https://orbiontechnologies.in
    - key: DATABASE_URL
      sync: false
    - key: BETTER_AUTH_SECRET
      sync: false
