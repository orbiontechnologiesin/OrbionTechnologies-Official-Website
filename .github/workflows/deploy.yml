name: Orbion Technologies CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Lint
        run: npm run lint

      - name: Run Production Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://ci_validation:ci_validation@ep-dummy-ci.us-east-2.aws.neon.tech/neondb?sslmode=require"
          BETTER_AUTH_SECRET: "ci-validation-secret-at-least-thirty-two-chars-long"
          BETTER_AUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_SITE_URL: "https://orbiontechnologies.in"
